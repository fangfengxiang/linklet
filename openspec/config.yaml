schema: spec-driven
context: |
  Tech stack: OpenResty, Lua 5.1/LuaJIT, PostgreSQL (pgmoon)
  Testing: busted (BDD), luacov (coverage)
  Linting: luacheck
  Deployment: Docker, Kubernetes, GitHub Actions CI/CD
  Package: LuaRocks (rockspec)
  
  Linklet is a multi-tenant short link system built on OpenResty + Lua + PostgreSQL.
  Core modules: short code generation (golden ratio obfuscation + Base62),
  ID generator (segment-based), resolution gateway (cache + DB + redirect),
  management API (create/gen/disable), AK/SK auth, multi-tenant isolation.
rules:
  proposal:
    - Include rollback plan
    - Reference design.md decisions
  specs:
    - Use Given/When/Then format
    - Include both positive and negative scenarios
  tasks:
    - Each task must be independently verifiable
