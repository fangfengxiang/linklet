# conf/nginx.conf
# Linklet Nginx 主配置 / Main configuration

env LINKLET_ROLE;
env PGHOST;
env PGPORT;
env PGDATABASE;
env PGUSER;
env PGPASSWORD;
env LINKLET_ENCRYPTION_KEY;
env SEGMENT_SIZE;
env CACHE_TTL;
env CACHE_SYNC_INTERVAL;
env PGPOOLSIZE;
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Lua 包路径 / Lua package path
    lua_package_path "/app/lib/?.lua;;";

    # 共享缓存字典 / Shared cache dictionary
    lua_shared_dict linklet_cache 10m;

    # DNS 解析器（Docker 内置 DNS）/ DNS resolver (Docker embedded DNS)
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # 日志 / Logging
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # 初始化应用 / Initialize app
    init_by_lua_block {
        local app = require("linklet.app")
        app.init({
            role = os.getenv("LINKLET_ROLE") or "combined",
            database = {
                host = os.getenv("PGHOST") or "127.0.0.1",
                port = tonumber(os.getenv("PGPORT")) or 5432,
                database = os.getenv("PGDATABASE") or "linklet",
                user = os.getenv("PGUSER") or "linklet",
                password = os.getenv("PGPASSWORD") or "",
                max_pool_size = tonumber(os.getenv("PGPOOLSIZE")) or 10,
            },
            encryption_key = os.getenv("LINKLET_ENCRYPTION_KEY"),
            cache_sync_interval = tonumber(os.getenv("CACHE_SYNC_INTERVAL")) or 0.5,
            cache_dict = "linklet_cache",
            segment_size = tonumber(os.getenv("SEGMENT_SIZE")),
            cache_ttl = tonumber(os.getenv("CACHE_TTL")) or 300,
        })
    }

    init_worker_by_lua_block { require("linklet.app").init_worker() }

    include /etc/nginx/conf.d/*.conf;
}
