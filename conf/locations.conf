    # 短链业务 API / Short link business API
    location /api/v1/shorten/ {
        content_by_lua_block {
            require("linklet.app").handle_admin()
        }
    }

    # 后台管理 API（IP 白名单限制）/ Admin management API (IP restricted)
    # 生产环境修改为实际运维 IP / Change to real admin IPs in production
    location /api/v1/admin/ {
        allow 127.0.0.1;
        deny all;
        content_by_lua_block {
            require("linklet.app").handle_admin()
        }
    }

    location = /health {
        access_log off;
        content_by_lua_block { require("linklet.app").health() }
    }
    location = /health/live {
        access_log off;
        return 200 "ok";
    }

    # 根路径 / Root
    location = / {
        return 200 "linklet";
    }

    # 解析网关 / Resolution gateway — 6+ 字符字母数字短码
    location ~ "^/([a-zA-Z0-9]{6,})$" {
        content_by_lua_block {
            require("linklet.app").handle_gateway()
        }
    }
