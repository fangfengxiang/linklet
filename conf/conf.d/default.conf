# conf/conf.d/default.conf

server {
    listen 80;
    server_name _;

    # 短链业务 API / Short link business API
    location /api/v1/shorten/ {
        content_by_lua_block {
            require("app").handle_request()
        }
    }

    # 后台管理 API（IP 白名单限制）/ Admin management API (IP restricted)
    # 生产环境修改为实际运维 IP / Change to real admin IPs in production
    location /api/v1/admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        content_by_lua_block {
            require("app").handle_request()
        }
    }

    # 健康检查 / Health check（^~ 优先于正则匹配）
    location ^~ /health {
        access_log off;
        return 200 "ok";
    }

    # 根路径 / Root
    location = / {
        return 200 "linklet";
    }

    # 解析网关 / Resolution gateway — 6+ 字符字母数字短码
    location ~ "^/([a-zA-Z0-9]{6,})$" {
        content_by_lua_block {
            require("app").handle_request()
        }
    }
}
