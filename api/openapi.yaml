            on failure'
          content: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: &id002
              type: object
              properties:
                target_url:
                  type: string
                  format: uri
                  maxLength: 2048
                  pattern: ^https?://
                group_id:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                expires_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Future RFC3339 timestamp; omitted/null means permanent
              required:
              - target_url
              - group_id
      security:
      - AccessKey: []
        Signature: []
        Timestamp: []
