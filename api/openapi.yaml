      operationId: post_api_v1_shorten_create
      description: 'Shared creation rules: active tenant with group grant, enabled
        group, deployed domain. Returns data.code.'
      responses:
        '200':
          description: 'JSON envelope: code=0 on success; nonzero code and data=null
            on failure'
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
