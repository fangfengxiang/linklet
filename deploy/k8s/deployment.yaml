# deploy/k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linklet
  labels:
    app: linklet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: linklet
  template:
    metadata:
      labels:
        app: linklet
    spec:
      containers:
        - name: linklet
          image: ghcr.io/frank/linklet:latest
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: linklet-config
          env:
            - name: LINKLET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: linklet-db-secret
                  key: encryption-key
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: linklet-db-secret
                  key: host
            - name: PGDATABASE
              value: linklet
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: linklet-db-secret
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: linklet-db-secret
                  key: password
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: linklet
  labels:
    app: linklet
spec:
  type: ClusterIP
  selector:
    app: linklet
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
