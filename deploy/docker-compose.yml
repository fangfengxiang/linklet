services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linklet
      POSTGRES_USER: linklet
      POSTGRES_PASSWORD: ${PGPASSWORD:-linklet_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../migrations/003_integrity.sql:/docker-entrypoint-initdb.d/003_integrity.sql:ro
      - ../migrations/004_v02_expand.sql:/docker-entrypoint-initdb.d/004_v02_expand.sql:ro
      - ../migrations/005_v02_switch.sql:/docker-entrypoint-initdb.d/005_v02_switch.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linklet"]
      interval: 3s
      timeout: 3s
      retries: 10
  linklet:
    build:
      context: ..
      target: runtime
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: linklet
      PGUSER: linklet
      PGPASSWORD: ${PGPASSWORD:-linklet_dev}
      LINKLET_ENCRYPTION_KEY: ${LINKLET_ENCRYPTION_KEY:?Set a 64-character hexadecimal encryption key}
      SEGMENT_SIZE: 1000
      CACHE_TTL: 300
      CACHE_SYNC_INTERVAL: 0.5
volumes:
  pgdata:
