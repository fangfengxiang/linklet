# .github/workflows/test.yml
name: Test

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua toolchain
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Verify installed Lua
        run: lua -v

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v5
        with:
          # 3.11.1 compiles the oversized manifest under LuaJIT; 3.13 uses JSON.
          luaRocksVersion: "3.13.0"

      - name: Verify installed LuaRocks
        run: luarocks --version

      - name: Install luacheck
        run: luarocks install luacheck --local

      - name: Run luacheck
        run: |
          export PATH="$PATH:$HOME/.luarocks/bin"
          luacheck lib/ spec/ --codes

  test:
    name: Test (Lua ${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.3", "luajit-2.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua ${{ matrix.lua }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Verify installed Lua
        run: lua -v

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v5
        with:
          # 3.11.1 compiles the oversized manifest under LuaJIT; 3.13 uses JSON.
          luaRocksVersion: "3.13.0"

      - name: Verify installed LuaRocks
        run: luarocks --version

      - name: Install dependencies
        run: |
          luarocks install busted --local
          luarocks install luacov --local
          luarocks install lua-cjson --local
          luarocks install pgmoon --local

      - name: Run tests with coverage
        run: |
          export PATH="$PATH:$HOME/.luarocks/bin"
          busted spec/ --coverage -o utfTerminal
          luacov
          cat luacov.report.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.lua }}
          path: luacov.*.out

  acceptance:
    name: OpenResty Test::Nginx acceptance
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Real OpenResty and PostgreSQL acceptance
        run: docker compose -p linklet-acceptance -f deploy/acceptance-compose.yml up --build --abort-on-container-exit --exit-code-from acceptance
      - name: Cleanup isolated acceptance services
        if: always()
        run: docker compose -p linklet-acceptance -f deploy/acceptance-compose.yml down --volumes
