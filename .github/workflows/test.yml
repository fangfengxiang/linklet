# .github/workflows/test.yml
name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua toolchain
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Install luacheck
        run: luarocks install luacheck --local

      - name: Run luacheck
        run: |
          export PATH="$PATH:$HOME/.luarocks/bin"
          luacheck src/ spec/ --codes

  test:
    name: Test (Lua ${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.3", "luajit-2.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua ${{ matrix.lua }}
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Install dependencies
        run: |
          luarocks install busted --local
          luarocks install luacov --local
          luarocks install lua-cjson --local
          luarocks install pgmoon --local

      - name: Run tests with coverage
        run: |
          export PATH="$PATH:$HOME/.luarocks/bin"
          busted spec/ -c "luacov" -o utfTerminal
          luacov src/
          cat luacov.report.out

      - name: Check coverage threshold
        run: |
          THRESHOLD=80
          COV=$(grep "^Total" luacov.report.out | awk '{print $NF}' | tr -d '%')
          if [ -z "$COV" ]; then echo "Coverage: unable to parse"; exit 1; fi
          echo "Coverage: ${COV}% (threshold: ${THRESHOLD}%)"
          if [ $(echo "$COV >= $THRESHOLD" | bc) -eq 1 ]; then
            echo "✓ Coverage meets threshold"
          else
            echo "✗ Coverage below threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.lua }}
          path: luacov.*.out

  e2e:
    name: E2E Test (Docker)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t linklet:test .

      - name: Start services
        run: |
          docker run -d --name linklet -p 8080:80 linklet:test
          sleep 5

      - name: Health check
        run: |
          curl -sf http://localhost:8080/health || exit 1

      - name: Run E2E tests
        run: |
          docker exec linklet busted test/e2e/ -o utfTerminal || true

      - name: Cleanup
        if: always()
        run: docker rm -f linklet || true
