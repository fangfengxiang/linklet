# .github/workflows/benchmark.yml
name: Benchmark

on:
  pull_request:
    branches: [main, develop]

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v5
        with:
          # 3.11.1 compiles the oversized manifest under LuaJIT; 3.13 uses JSON.
          luaRocksVersion: "3.13.0"

      - name: Verify installed LuaRocks
        run: luarocks --version

      - name: Install dependencies
        run: |
          luarocks install busted --local
          luarocks install lua-cjson --local

      - name: Run obfuscator benchmark
        run: |
          export PATH="$PATH:$HOME/.luarocks/bin"
          make benchmark
